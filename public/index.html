<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>落札ラボ — JJConnect</title>
  <style>
    :root {
      /* light palette (self-contained — shell has no tokens.css) */
      --bg:#f4f6f9; --card:#ffffff; --border:#e3e8ef;
      --text:#1e293b; --muted:#64748b; --orange:#f2914a;
      --do:#2b6cb0; --do-bg:#eef4fb;
      --ki:#0f9d63; --ki-bg:#ecf8f1;
      --ho:#dd6b20; --ho-bg:#fdf3e8;
      --re:#6b46c1; --re-bg:#f4eefc;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:32px 20px; color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","PingFang SC","Microsoft YaHei",sans-serif;
      background:linear-gradient(165deg,#e9f0fb 0%,var(--bg) 60%);
    }
    .shell { width:100%; max-width:720px; }

    .brand { display:flex; align-items:center; gap:14px; }
    .brand-mark {
      width:54px; height:54px; border-radius:13px; background:var(--orange); color:#fff;
      font-size:30px; font-weight:800; display:flex; align-items:center; justify-content:center;
      box-shadow:0 6px 16px rgba(242,145,74,.32);
    }
    .brand-name { font-size:34px; font-weight:800; letter-spacing:.04em; }
    .brand-romaji { font-size:16px; font-weight:600; color:var(--muted); letter-spacing:.06em; }
    .brand-sub { color:var(--muted); font-size:13px; margin:8px 0 26px 68px; }

    .tools { display:grid; gap:14px; }
    .tool {
      display:flex; align-items:center; gap:18px; text-decoration:none; color:inherit;
      background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px 22px;
      transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    }
    .tool:hover { transform:translateY(-2px); box-shadow:0 12px 28px rgba(26,41,66,.13); }
    .kanji {
      width:64px; height:64px; flex-shrink:0; border-radius:14px;
      font-size:38px; font-weight:800; display:flex; align-items:center; justify-content:center;
    }
    .tool.do .kanji { background:var(--do-bg); color:var(--do); }
    .tool.ki .kanji { background:var(--ki-bg); color:var(--ki); }
    .tool.ho .kanji { background:var(--ho-bg); color:var(--ho); }
    .tool.re .kanji { background:var(--re-bg); color:var(--re); }
    .tool.do:hover { border-color:var(--do); }
    .tool.ki:hover { border-color:var(--ki); }
    .tool.ho:hover { border-color:var(--ho); }
    .tool.re:hover { border-color:var(--re); }
    .t-body { flex:1; min-width:0; }
    .t-name { font-size:19px; font-weight:700; }
    .t-name span.romaji { font-size:13px; font-weight:600; color:var(--muted); margin-left:9px; }
    .t-name .prep-tag {
      font-size:11px; font-weight:600; color:#c2410c; background:#fff7ed; border:1px solid #fed7aa;
      padding:1px 8px; border-radius:10px; margin-left:9px; vertical-align:2px;
    }
    .t-desc { font-size:13px; color:var(--muted); margin-top:4px; line-height:1.6; }
    .t-arrow { color:#cbd5e1; font-size:22px; flex-shrink:0; }

    .foot { text-align:center; color:var(--muted); font-size:12px; margin-top:26px; letter-spacing:.03em; }
    .foot b { color:#475569; }

    @media (max-width:520px) {
      .brand-name { font-size:27px; }
      .brand-sub { margin-left:0; }
      .kanji { width:54px; height:54px; font-size:32px; }
      .tool { padding:16px; gap:14px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="brand">
      <div class="brand-mark">札</div>
      <div class="brand-name">落札ラボ <span class="brand-romaji">RakuLab</span></div>
    </div>
    <p class="brand-sub">日本不动产竞売 · 全流程作业平台 · 自动化事务管理 · AI决策支援</p>

    <div class="tools">
      <a class="tool do" href="https://rakusat.jjconnect.online/rakusat">
        <div class="kanji">研</div>
        <div class="t-body">
          <div class="t-name">研<span class="romaji">Lab</span></div>
          <div class="t-desc">法拍管理 — 批次总览、现地调查、快速分析、机会分析</div>
        </div>
        <div class="t-arrow">→</div>
      </a>
      <a class="tool ki" href="https://rakusat.jjconnect.online/diary">
        <div class="kanji">記</div>
        <div class="t-body">
          <div class="t-name">記<span class="romaji">Diary</span></div>
          <div class="t-desc">进程日志 — 物件全流程操作记录与待跟进事项</div>
        </div>
        <div class="t-arrow">→</div>
      </a>
      <a class="tool ho" href="https://rakusat.jjconnect.online/justsale/">
        <div class="kanji">報</div>
        <div class="t-body">
          <div class="t-name">報<span class="romaji">マイソク</span></div>
          <div class="t-desc">マイソク自动生成 — 物件销售传单一键制作</div>
        </div>
        <div class="t-arrow">→</div>
      </a>
      <!-- 例 wizard ships with the Supabase cutover — until then it lives on the parked
           cutover branch's preview. fix/login-returnto = the cutover lineage tip (the old
           supabase-migration alias serves stale June-10 code). At cutover, flip this to
           https://rakusat.jjconnect.online/rakusat/input/ . -->
      <a class="tool re" href="https://monopages-git-fix-login-returnto-yanogins-projects.vercel.app/rakusat/input/">
        <div class="kanji">例</div>
        <div class="t-body">
          <div class="t-name">例<span class="romaji">Rei</span><span class="prep-tag">准备中·可测试</span></div>
          <div class="t-desc">数据资料入例甄别 — 三点セット PDF 报告录入与核对</div>
        </div>
        <div class="t-arrow">→</div>
      </a>
    </div>

    <p class="foot">Powered by <b>JJconnect.jp</b></p>
  </div>
</body>
</html>
